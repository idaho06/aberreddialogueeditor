[package]
name = "aberreddialogueeditor"
version = "0.1.0"
edition = "2024"

[dependencies]
aberredengine = { git = "https://github.com/idaho06/aberredengine.git", branch = "develop-0.2.0", default-features = false }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17"
futures = "0.3"
crossbeam-channel = "0.5"
rustc-hash = "2.1"
