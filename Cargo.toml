[package]
name = "aberreddialogueeditor"
version = "0.2.0"
edition = "2024"
description = "Node-graph editor for AberredEngine dialogue JSON"
authors = ["César Rodríguez (Idaho06)"]
license = "MIT"
repository = "https://github.com/idaho06/aberreddialogueeditor"
readme = "README.md"
keywords = ["dialogue", "editor", "node-graph", "gamedev", "aberredengine"]
categories = ["game-development"]
# Depends on a git revision of the engine, so it cannot go to crates.io.
publish = false

[dependencies]
aberredengine = { git = "https://github.com/idaho06/aberredengine.git", rev = "6c4d8ee19222c574822a09421326d6b2db3b5a3f", default-features = false }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rfd = "0.18"
futures = "0.3"
crossbeam-channel = "0.5"
rustc-hash = "2.1"
